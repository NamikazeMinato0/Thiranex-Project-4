<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather dashboard</title>
<style>
:root{
  color-scheme:light dark;
  --paper:oklch(97% .008 250);--surface:oklch(100% 0 0);--ink:oklch(24% .05 265);--muted:oklch(42% .04 265);
  --line:oklch(80% .02 255);--btn:oklch(46% .1 175);--btn-ink:oklch(100% 0 0);--ring:oklch(52% .22 355);--glow:oklch(90% .16 95);--danger:oklch(46% .18 25);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--paper:oklch(20% .03 265);--surface:oklch(26% .035 265);--ink:oklch(95% .01 250);--muted:oklch(78% .03 255);--line:oklch(42% .03 265);--btn:oklch(80% .13 170);--btn-ink:oklch(20% .03 265);--ring:oklch(78% .17 355);--glow:oklch(34% .08 95);--danger:oklch(78% .13 25)}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:1.0625rem/1.5 var(--font)}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:3px}
main{width:min(100% - 2rem,56rem);margin:0 auto;padding-block:clamp(1.5rem,5vw,3.5rem)}
h1{font-size:clamp(2rem,6vw,3rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 1.25rem}
h2{font-size:1.3rem;margin:2rem 0 .75rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer;min-height:2.75rem;min-width:2.75rem;padding:.4rem 1rem;background:transparent;border:2px solid var(--ink);border-radius:.5rem}
button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
button:disabled{opacity:.6;cursor:progress}
.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.search{display:flex;gap:.5rem;flex-wrap:wrap}
.search input{flex:1 1 14rem;min-height:2.75rem;font:inherit;color:var(--ink);background:var(--surface);padding:.5rem .75rem;border:2px solid var(--ink);border-radius:.4rem}
.units{display:inline-flex;gap:.25rem;margin-top:.75rem}
.units button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0 0;padding:0;list-style:none;align-items:center}
.chips button{min-height:2.75rem;border-radius:2rem;border-color:var(--line)}
.error{margin:1rem 0 0;padding:1rem;border:2px solid var(--danger);border-radius:.6rem;background:var(--surface)}
.error strong{color:var(--danger)}
#view{margin-top:1.5rem}
#view[aria-busy="true"]{opacity:.55}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:.9rem;padding:1.25rem}
.now{display:grid;gap:1.5rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));background:var(--glow);color:var(--ink)}
@media (prefers-color-scheme:dark){.now{color:oklch(95% .01 250)}}
.now h2{margin:0}
.place small{display:block}
.temp{font-size:clamp(4rem,14vw,6.5rem);font-weight:700;line-height:1;letter-spacing:-.04em;margin:.25rem 0}
.cond{font-size:1.25rem}
.metrics{display:grid;gap:.75rem 1.5rem;grid-template-columns:1fr 1fr;margin:0;align-content:start}
.metrics dt{font-size:.95rem}
.metrics dd{margin:0;font-size:1.5rem;font-weight:700}
meter{width:100%;height:.8rem}
.days{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));list-style:none;margin:0;padding:0}
.day{text-align:center}
.day .ico{font-size:2rem}
.day p{margin:.2rem 0}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;margin-top:1rem}
details{margin-top:2rem}
summary{cursor:pointer;min-height:2.75rem;display:flex;align-items:center;font-weight:700}
pre{overflow:auto;max-height:22rem;padding:1rem;background:var(--surface);border:2px solid var(--ink);border-radius:.6rem;font-size:.85rem}
.empty p{max-width:60ch}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .15s,color .15s}#view{transition:opacity .2s}}
</style>
</head>
<body>
<main>
<h1>Weather dashboard</h1>

<form class="search" id="search" role="search" autocomplete="off">
  <label class="vh" for="q">City name</label>
  <input id="q" name="q" type="search" placeholder="Search a city, such as Nairobi" required minlength="2" maxlength="80">
  <button class="primary" type="submit">Get weather</button>
</form>
<div class="units" role="group" aria-label="Units">
  <button type="button" data-unit="metric" aria-pressed="true">°C, km/h</button>
  <button type="button" data-unit="imperial" aria-pressed="false">°F, mph</button>
</div>
<div id="alts"></div>
<div id="error" role="alert"></div>
<p class="vh" id="status" role="status" aria-live="polite"></p>

<div id="view" aria-busy="false">
  <section class="panel empty" id="empty">
    <h2>Search for a city</h2>
    <p>Enter a place name to see its live temperature, humidity, wind and a five-day outlook. Data comes from the free Open-Meteo service.</p>
    <ul class="chips" aria-label="Example cities">
      <li><button type="button" data-city="London">London</button></li>
      <li><button type="button" data-city="Lagos">Lagos</button></li>
      <li><button type="button" data-city="Tokyo">Tokyo</button></li>
      <li><button type="button" data-city="São Paulo">São Paulo</button></li>
    </ul>
  </section>
</div>
</main>

<script>
"use strict";
/* ===== 1. Config ===== */
const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
const WX_URL  = "https://api.open-meteo.com/v1/forecast";
const REFRESH_MS = 10 * 60 * 1000;   // "real-time": refresh every 10 minutes
const TIMEOUT_MS = 8000;
const KEY = "weather-dashboard.v1";

const state = { unit: "metric", place: null, data: null, loadedAt: 0, requestId: 0 };
const $ = s => document.querySelector(s);

/* ===== 2. Fetch layer: async/await, timeout, cancellation, typed errors ===== */
class ApiError extends Error {
  constructor(kind, message) { super(message); this.name = "ApiError"; this.kind = kind; }
}

async function getJSON(url) {
  // Timeout via Promise.race instead of AbortSignal: some sandboxed environments
  // proxy fetch() with postMessage, which cannot clone an AbortSignal.
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new ApiError("timeout", "The request took too long.")), TIMEOUT_MS);
  });
  try {
    const res = await Promise.race([fetch(url), timeout]);
    if (!res.ok) {                                   // fetch only rejects on network failure, so check status ourselves
      let reason = "";
      try { reason = (await res.json()).reason || ""; } catch { /* body was not JSON */ }
      throw new ApiError(res.status === 429 ? "rate" : "http", reason || `The weather service returned status ${res.status}.`);
    }
    return await Promise.race([res.json(), timeout]); // throws SyntaxError on invalid JSON
  } catch (err) {
    throw classify(err);
  } finally {
    clearTimeout(timer);
  }
}

function classify(err) {
  if (err instanceof ApiError) return err;
  if (err.name === "TimeoutError") return new ApiError("timeout", "The request took too long.");
  if (err.name === "AbortError") return new ApiError("aborted", "Request cancelled.");
  if (err instanceof SyntaxError) return new ApiError("parse", "The service sent a response I couldn’t read.");
  if (err instanceof TypeError) return new ApiError(navigator.onLine ? "network" : "offline", "Network request failed.");
  return new ApiError("unknown", err.message || "Something went wrong.");
}

const MESSAGES = {
  offline: "You appear to be offline. Reconnect and try again.",
  network: "Couldn’t reach the weather service. Check your connection, and note that some browsers block requests from pages opened as local files in strict modes.",
  timeout: "The weather service didn’t respond in time. Try again in a moment.",
  rate: "Too many requests right now. Wait a minute and try again.",
  http: "The weather service reported a problem.",
  parse: "The weather service sent data I couldn’t understand.",
  notfound: "No city matched that name. Check the spelling or try a larger nearby city.",
  unknown: "Something unexpected went wrong."
};

/* ===== 3. API calls ===== */
async function geocode(name) {
  const url = `${GEO_URL}?${new URLSearchParams({ name, count: 5, language: "en", format: "json" })}`;
  const json = await getJSON(url);
  if (!Array.isArray(json.results) || !json.results.length) throw new ApiError("notfound", MESSAGES.notfound);
  return json.results.map(r => ({
    name: r.name, region: r.admin1 || "", country: r.country || "",
    lat: r.latitude, lon: r.longitude
  }));
}

async function forecast(place, unit) {
  const imperial = unit === "imperial";
  const params = new URLSearchParams({
    latitude: place.lat, longitude: place.lon, timezone: "auto", forecast_days: 5,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,is_day,wind_speed_10m,wind_direction_10m",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
    temperature_unit: imperial ? "fahrenheit" : "celsius",
    wind_speed_unit: imperial ? "mph" : "kmh",
    precipitation_unit: imperial ? "inch" : "mm"
  });
  const json = await getJSON(`${WX_URL}?${params}`);
  if (!json?.current || !json?.daily?.time) throw new ApiError("parse", MESSAGES.parse); // validate nested shape
  return json;
}

/* ===== 4. Controller: ties search, loading, errors and rendering together ===== */
async function load(place, { silent = false } = {}) {
  const id = ++state.requestId;                    // newest request wins; older responses are ignored
  setBusy(true, silent ? "" : `Loading weather for ${place.name}…`);
  clearError();
  try {
    const data = await forecast(place, state.unit);
    if (id !== state.requestId) return;            // a newer request started while we waited
    state.place = place; state.data = data; state.loadedAt = Date.now();
    save();
    renderWeather();
    $("#status").textContent = `Weather updated for ${place.name}.`;
  } catch (err) {
    if (id === state.requestId) showError(err);
  } finally {
    if (id === state.requestId) setBusy(false);
  }
}

async function search(name) {
  const id = ++state.requestId;
  setBusy(true, `Searching for ${name}…`);
  clearError();
  try {
    const matches = await geocode(name.trim());
    if (id !== state.requestId) return;
    renderAlternatives(matches);
    await load(matches[0]);
  } catch (err) {
    if (id === state.requestId) showError(err);
  } finally {
    if (id === state.requestId) setBusy(false);
  }
}

/* ===== 5. Rendering: turn nested JSON into DOM ===== */
function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
}

// WMO weather codes → [label, day icon, night icon]
function describe(code, isDay = 1) {
  const d = isDay === 1;
  const table = [
    [[0], "Clear sky", "☀️", "🌙"], [[1, 2], "Partly cloudy", "🌤️", "☁️"], [[3], "Overcast", "☁️", "☁️"],
    [[45, 48], "Fog", "🌫️", "🌫️"], [[51, 53, 55, 56, 57], "Drizzle", "🌦️", "🌧️"],
    [[61, 63, 65, 66, 67], "Rain", "🌧️", "🌧️"], [[71, 73, 75, 77], "Snow", "🌨️", "🌨️"],
    [[80, 81, 82], "Rain showers", "🌦️", "🌧️"], [[85, 86], "Snow showers", "🌨️", "🌨️"],
    [[95, 96, 99], "Thunderstorm", "⛈️", "⛈️"]
  ];
  const row = table.find(r => r[0].includes(code));
  return row ? { text: row[1], icon: d ? row[2] : row[3] } : { text: "Unknown conditions", icon: "❔" };
}
const compass = deg => ["N","NE","E","SE","S","SW","W","NW"][Math.round(deg / 45) % 8];

function renderWeather() {
  const { place, data } = state;
  const { current: c, current_units: u, daily: d, daily_units: du } = data;
  const cond = describe(c.weather_code, c.is_day);

  // "Now" panel: values come from nested `current`, units from `current_units`
  const metrics = el("dl", { className: "metrics" });
  const add = (label, ...value) => metrics.append(el("div", {}, el("dt", {}, label), el("dd", {}, ...value)));
  add("Feels like", `${Math.round(c.apparent_temperature)}${u.apparent_temperature}`);
  add("Humidity", `${c.relative_humidity_2m}${u.relative_humidity_2m}`);
  add("Wind", `${Math.round(c.wind_speed_10m)} ${u.wind_speed_10m} ${compass(c.wind_direction_10m)}`);
  add("Precipitation", `${c.precipitation} ${u.precipitation}`);
  const meter = el("meter", { min: 0, max: 100, value: c.relative_humidity_2m });
  meter.setAttribute("aria-label", `Humidity ${c.relative_humidity_2m} percent`);
  metrics.append(el("div", { style: "grid-column:1/-1" }, meter));

  const where = [place.region, place.country].filter(Boolean).join(", ");
  const now = el("section", { className: "panel now" });
  now.setAttribute("aria-labelledby", "place-h");
  now.append(
    el("div", { className: "place" },
      el("h2", { id: "place-h" }, place.name, el("small", { className: "muted" }, where)),
      el("p", { className: "temp" }, `${Math.round(c.temperature_2m)}${u.temperature_2m}`),
      el("p", { className: "cond" }, el("span", { ariaHidden: "true" }, cond.icon + " "), cond.text)
    ),
    metrics
  );

  // Forecast: daily data is parallel arrays; zip them into objects
  const days = d.time.map((date, i) => ({
    date, code: d.weather_code[i], hi: d.temperature_2m_max[i], lo: d.temperature_2m_min[i],
    rain: d.precipitation_probability_max[i]
  }));
  const fmt = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric" });
  const list = el("ul", { className: "days" }, ...days.map((day, i) => {
    const w = describe(day.code);
    return el("li", { className: "panel day" },
      el("p", {}, el("strong", {}, i === 0 ? "Today" : fmt.format(new Date(day.date + "T12:00")))),
      el("p", { className: "ico", ariaHidden: "true" }, w.icon),
      el("p", {}, w.text),
      el("p", {}, `${Math.round(day.hi)}${du.temperature_2m_max} / `, el("span", { className: "muted" }, `${Math.round(day.lo)}${du.temperature_2m_min}`)),
      el("p", { className: "muted" }, day.rain != null ? `${day.rain}% rain` : "")
    );
  }));

  const refresh = el("button", { type: "button", id: "refresh", textContent: "Refresh now" });
  const stamp = new Date(c.time).toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" });
  const bar = el("div", { className: "bar" },
    el("p", { className: "muted" }, `Observed ${stamp} local time in ${place.name}. Refreshes every 10 minutes.`), refresh);

  const raw = el("details", {}, el("summary", {}, "View the raw JSON response"),
    el("pre", { tabIndex: 0 }, JSON.stringify(data, null, 2)));

  const forecastH = el("h2", {}, "Next 5 days");
  $("#view").replaceChildren(now, forecastH, list, bar, raw);
}

function renderAlternatives(matches) {
  const box = $("#alts");
  if (matches.length < 2) return box.replaceChildren();
  const items = matches.slice(1).map(m => {
    const b = el("button", { type: "button", textContent: [m.name, m.region, m.country].filter(Boolean).join(", ") });
    b.dataset.index = matches.indexOf(m);
    return el("li", {}, b);
  });
  box.replaceChildren(el("ul", { className: "chips", ariaLabel: "Other matching places" }, el("li", { className: "muted" }, "Other matches:"), ...items));
  box._matches = matches;
}

/* ===== 6. UI helpers ===== */
function setBusy(on, message) {
  $("#view").setAttribute("aria-busy", on);
  $("#search").querySelector("button").disabled = on;
  if (message) $("#status").textContent = message;
}
function showError(err) {
  const box = $("#error");
  box.replaceChildren(el("div", { className: "error" }, el("strong", {}, "Couldn’t get the weather. "),
    err.kind === "http" || err.kind === "unknown" ? `${MESSAGES[err.kind]} ${err.message}` : MESSAGES[err.kind] || err.message));
  if (state.place) {
    box.firstChild.append(" ", el("button", { type: "button", id: "retry", textContent: "Try again" }));
  }
}
function clearError() { $("#error").replaceChildren(); }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ place: state.place, unit: state.unit })); } catch { /* storage unavailable */ }
}
function restore() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved?.unit) state.unit = saved.unit === "imperial" ? "imperial" : "metric";
    if (saved?.place && Number.isFinite(saved.place.lat) && Number.isFinite(saved.place.lon)) return saved.place;
  } catch { /* ignore corrupt data */ }
  return null;
}
function syncUnitButtons() {
  document.querySelectorAll("[data-unit]").forEach(b => b.setAttribute("aria-pressed", b.dataset.unit === state.unit));
}

/* ===== 7. Events (delegated where content is dynamic) ===== */
$("#search").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (q) search(q);
});
document.addEventListener("click", e => {
  const unit = e.target.closest("[data-unit]");
  if (unit && unit.dataset.unit !== state.unit) {
    state.unit = unit.dataset.unit; syncUnitButtons(); save();
    if (state.place) load(state.place);
  }
  const city = e.target.closest("[data-city]");
  if (city) { $("#q").value = city.dataset.city; search(city.dataset.city); }
  const alt = e.target.closest("[data-index]");
  if (alt) {
    const matches = $("#alts")._matches;
    const pick = matches[Number(alt.dataset.index)];
    renderAlternatives([pick, ...matches.filter(m => m !== pick)]);
    load(pick);
  }
  if (e.target.closest("#refresh, #retry") && state.place) load(state.place);
});
window.addEventListener("online", () => { if (state.place) load(state.place, { silent: true }); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.place && Date.now() - state.loadedAt > REFRESH_MS) load(state.place, { silent: true });
});
setInterval(() => { if (state.place && !document.hidden) load(state.place, { silent: true }); }, REFRESH_MS);

/* ===== 8. Start ===== */
const saved = restore();
syncUnitButtons();
if (saved) { $("#q").value = saved.name; load(saved); }
</script>
</body>
</html>
